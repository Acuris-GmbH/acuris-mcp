[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acuris-mcp"
version = "1.0.0"
description = "MCP server for Acuris address validation & geocoding — 240+ countries, Royal Mail PAF (UK), free US/Canada census enrichment. Runs against your own Acuris API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Acuris GmbH", email = "support@acuris-geo.com" }]
keywords = ["mcp", "model-context-protocol", "address-validation", "geocoding", "census", "fips", "royal-mail-paf"]
dependencies = ["mcp>=1.10", "httpx>=0.27"]

[project.urls]
Homepage = "https://www.acuris-geo.com/"
Documentation = "https://api.acuris-geo.com/docs/mcp"
Repository = "https://github.com/Acuris-GmbH/acuris-mcp"

[project.scripts]
acuris-mcp = "acuris_mcp:main"
